name: CD Pipeline

# =============================================================================
# TODO 1: Configure Triggers
# =============================================================================
# This workflow should run when:
# - A version tag is pushed (e.g., v1.0.0, v1.2.3)

on:
  push:
    tags:
      - 'v*'

jobs:
  # ===========================================================================
  # TODO 2: Build and Push Docker Image
  # ===========================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Train model artifact
        run: |
          pip install -r requirements.txt
          python scripts/train_model.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:latest
            ${{ secrets.DOCKER_USERNAME }}/movie-rating-api:${{ github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

